name: Release

# Runs when a version tag (v1.2.3) is pushed, e.g. by `git flow release finish`.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # to create the GitHub Release and attach the .vsix

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the tag matches package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce package --out vscode-swh-${{ github.ref_name }}.vsix

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-swh-${{ github.ref_name }}.vsix
          generate_release_notes: true

      # the same package, for the Open VSX job
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-swh-${{ github.ref_name }}.vsix
          if-no-files-found: error

  publish:
    # Only publish to the Marketplace once tests, the tag check and the GitHub Release succeeded.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to authenticate to the Marketplace via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - run: npm ci

      - run: npx --yes @vscode/vsce publish --oidc

  open-vsx:
    # Publishes to Open VSX (https://open-vsx.org) the .vsix of the GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          extensionFile: vscode-swh-${{ github.ref_name }}.vsix
