# git-cliff configuration: CHANGELOG.md in the Keep a Changelog 1.1.0 format.
# https://git-cliff.org/docs/configuration
# https://keepachangelog.com/en/1.1.0/
#
# Releases are `vX.Y.Z` tags; commits follow Conventional Commits. Only the
# types users see make entries (see `commit_parsers`).
#
# A changelog is curated, not a dump of the Git log, so git-cliff never
# regenerates the file: do not run `git cliff -o CHANGELOG.md`, which would
# replace the curated releases with the commits.
#
# - `npm run changelog` previews the entries the commits since the last tag
#   give, without writing anything: what the next release will draft.
# - At release time, `npm run changelog:release` drafts the release of the
#   version in package.json right below the header (`--prepend`), above the
#   releases already there: its heading and date, then the entries from the
#   commits. Curate it (reword the entries for users, add what the commits
#   do not say) before tagging; it is kept as written from then on.
#
# Each release's heading links to what changed since the previous one: a
# link in the heading itself, as --prepend cannot update reference links at
# the bottom of the file.

[changelog]
# `--prepend` replaces this header at the top of the file, and drafts the
# new release right below it, above the releases already there. It must be
# exactly how the file starts, or the file would get a second header.
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# One release, with its link. Without a version (the preview of the commits
# since the last tag), a plain line instead of a heading.
body = """
{%- set repo = "https://github.com/himito/vscode-swh" -%}
{%- if version and previous.version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- elif version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
The next release, from the commits since {{ previous.version | default(value="the first commit") }}:
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits | filter(attribute="breaking", value=true) -%}
- **BREAKING:** {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim_end_matches(pat=".") }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor -%}
{% for commit in commits | filter(attribute="breaking", value=false) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim_end_matches(pat=".") }} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor %}
{%- endfor %}
"""
trim = false

[git]
conventional_commits = true
# commits that do not follow Conventional Commits make no entry
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# the sections, in the order Keep a Changelog gives them: the HTML comments
# sort the groups, and `striptags` removes them from the headings
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^fix\\(security\\)", group = "<!-- 5 -->Security" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  # refactor, docs, ci, build, chore, test, style: nothing users see
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
